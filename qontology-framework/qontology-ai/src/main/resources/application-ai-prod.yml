# AI 模块配置（生产环境）
qontology:
  ai:
    # 是否启用 AI 模块
    enabled: true
    # 单次调用超时时间
    timeout: 180s
    # 通义同步 HTTP 读取超时，小于治理预算，避免两层同时超时
    http-read-timeout: 150s
    # 最大调用次数（含首次）；长耗时抽取不自动重复提交
    max-attempts: 1
    # 向量存储类型：memory 内存存储、weaviate（生产环境推荐）
    vector-store: weaviate
    # Weaviate 向量存储配置（vector-store=weaviate 时生效）
    weaviate:
      host: weaviate:8080
      apiKey: WVF5YThaHlkYwhGUSmCRgsX3tD5ngdN8pkih
      className: SpringAiWeaviate # 必须是大驼
