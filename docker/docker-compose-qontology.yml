services:
  # qOntology 后端服务
  qontology-api:
    privileged: true
    image: ${QONTOLOGY_HUB}/qontology-server-ce:${QONTOLOGY_VERSION}
    restart: always
    profiles: ["all",  "qontology", "base" ]
    env_file: .env
    environment:
      - TZ=Asia/Shanghai
      - SPRING_CONFIG_LOCATION=file:/usr/app/jar/
      - SPRING_CONFIG_NAME=application
    # ports:
    #  - "18888:8080"
    mac_address: 28-C5-D2-B7-FC-F7
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./qOntology/server/logs:/usr/app/jar/logs
      - ./qOntology/server/upload:/usr/app/jar/upload
      - ./qOntology/server/application-prod.yml:/usr/app/jar/application-prod.yml
      - ./qOntology/server/application.yml:/usr/app/jar/application.yml
    depends_on:
      redis:
        condition: service_healthy
      mysql57:
        condition: service_healthy
    networks:
      - qontology_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
