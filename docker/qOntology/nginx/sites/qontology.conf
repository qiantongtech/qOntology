server {
    listen 80;
    server_name localhost;

    client_max_body_size 500M;
    add_header Strict-Transport-Security "max-age=31536000";
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    keepalive_timeout 600s;
    send_timeout 60s;

    location / {
        proxy_read_timeout 600;
        charset utf-8;
        root   /usr/share/nginx;
        try_files $uri $uri/ /index.html;
        index  index.html index.htm;
    }

    location /prod-api {
        add_header 'Access-Control-Allow-Methods' 'GET, POST,PUT,DELETE, OPTIONS';
        proxy_read_timeout 6000;
        rewrite ^/prod-api/(.*)$ /$1 break;
        proxy_set_header X-Real-Ip $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://qontology-api:8097;
    }

    # 握手会被当成普通 HTTP 请求，前端只能在刷新时重新查询消息列表。
    location /websocket/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://qontology-api:8097;
    }

    # kkFileView 同源反向代理。保留 /kkfileview 前缀，
    # 使服务生成的静态资源地址能够正确回到该代理路径。
    location /kkfileview/ {
        proxy_http_version 1.1;
        # 使用 $http_host 保留 IP 访问时的 8899 端口；$host 会丢失端口，
        # 导致 kkFileView 生成的预览资源错误地访问服务器 80 端口。
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://kkfileview:8012;
    }
}

